spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  # URL pública del frontend: es la que se codifica en los QR de las mesas
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  demo-data: ${DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:12h}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
