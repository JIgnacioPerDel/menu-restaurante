spring:
  datasource:
    # Modo PostgreSQL para que las migraciones de Flyway sirvan igual en dev y en prod
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Valores solo para desarrollo local. En producción se definen por variables de entorno.
app:
  demo-data: ${DEMO_DATA:true}
  jwt:
    secret: ${JWT_SECRET:dev-secret-no-usar-en-produccion-0123456789}
  admin:
    password: ${ADMIN_PASSWORD:admin}
